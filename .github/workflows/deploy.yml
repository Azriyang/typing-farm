# 构建并部署到 GitHub Pages
#
# 触发：推到 main 分支，或在 Actions 页面手动运行
# 产物：https://<用户名>.github.io/typing-farm/
#
# 前置：仓库 Settings → Pages → Source 选「GitHub Actions」（只需设置一次）

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，新推送会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 corepack 按 package.json 里的 packageManager 字段装指定版本 pnpm，
      # 避免 CI 与本地版本不一致导致 lockfile 解析出问题
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts 是必须的：pnpm 10+ 会把「未批准的依赖构建脚本」当成错误（退出码 1），
        # 而批准状态记在**本地全局配置**里，CI 里没有。
        # esbuild / rollup 的原生二进制来自各自的平台包（@esbuild/*、@rollup/*），
        # 不靠 postinstall，所以跳过脚本不影响构建。
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          # 双保险：万一以后去掉 --ignore-scripts，也别去下载 110MB 的 Electron
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck & build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
