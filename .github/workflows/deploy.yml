# 构建、测试并部署到 GitHub Pages
#
# 触发规则（这是本项目发版流程的核心约束）：
#   · push 到 main   → 只跑检查（类型检查 + 单元测试 + 构建），**不部署**
#   · push tag v*    → 跑检查，全部通过后才部署
#   · 手动运行       → 同样跑检查；只有 ref 是 v* 标签时才会部署
#
# 所以「部署」永远满足两个条件：
#   1. 类型检查与单元测试通过
#   2. 有一个版本 tag，且 tag 与 package.json 的 version 一致
#
# 发版：node scripts/release.mjs patch|minor|major --push
#       （脚本会先跑测试，通过后才升版本、提交、打 tag、推送）
#
# 前置：仓库 Settings → Pages → Source 选「GitHub Actions」（只需设置一次）

name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一引用（同一个分支 / 同一个 tag）内只跑一个，新推送取消旧的。
# 用 ref 分组而不是全局 pages 组：否则一次 main 推送会把正在进行的 tag 部署取消掉。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: 类型检查 / 单元测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 corepack 按 package.json 的 packageManager 装指定版本 pnpm，
      # 避免 CI 与本地版本不一致导致 lockfile 解析出问题
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts 是必须的：pnpm 10+ 会把「未批准的依赖构建脚本」当成错误（退出码 1），
        # 而批准状态记在本地全局配置里，CI 里没有。
        # esbuild / rollup 的原生二进制来自各自的平台包，不靠 postinstall。
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 只有 tag 推送才可能走到部署；这里顺带校验 tag 与 package.json 是否一致，
      # 防止"打了 tag 但版本号忘了改"导致线上产物无法识别版本
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION / tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 package.json ($PKG_VERSION) 不一致，拒绝部署"
            exit 1
          fi

  deploy:
    name: 部署到 Pages
    needs: verify
    # 只有版本 tag 才部署：main 分支的推送只做检查
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
